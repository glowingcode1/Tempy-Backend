name: CI/CD for Dev Environment

on:
  push:
    branches:
      - dev
  workflow_dispatch:
  

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code 
        uses: actions/checkout@v4

      - name: Create PEM file from Secret
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem

      - name: Ensure the target directory exists on EC2
        run: |
          ssh -i ~/.ssh/ec2_key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "mkdir -p ~/backend-dev"

      - name: Install Node.js, PM2 and Nginx if not installed
        run: |
          ssh -i ~/.ssh/ec2_key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
            if ! command -v npm >/dev/null 2>&1; then
              curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            if ! command -v pm2 >/dev/null 2>&1; then
              sudo npm install -g pm2
            fi

            if ! command -v nginx >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y nginx
              sudo systemctl enable nginx
              sudo systemctl start nginx
            fi

            node -v && npm -v && pm2 -v
          '

      - name: Copy files to EC2
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude 'node_modules' --exclude '.env*' \
            -e "ssh -i ~/.ssh/ec2_key.pem -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/backend-dev/

      - name: Install dependencies
        run: |
          ssh -i ~/.ssh/ec2_key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
            cd ~/backend-dev
            npm install --force
          '
      - name: Write .env.dev on EC2
        run: |
          printf '%s\n' "${{ secrets.ENV_DEV }}" | ssh -i ~/.ssh/ec2_key.pem -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} 'cat > ~/backend-dev/backend/.env.dev && chmod 600 ~/backend-dev/backend/.env.dev'

      - name: Start or Restart PM2 Service
        run: |
          ssh -i ~/.ssh/ec2_key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
            cd ~/backend-dev
            if pm2 describe server-dev > /dev/null 2>&1; then
              pm2 restart server-dev --update-env
            else
              pm2 start server.js --name server-dev
            fi
            pm2 save
            pm2 list
          '


      - name: Cleanup PEM file
        if: always()
        run: rm -f ~/.ssh/ec2_key.pem